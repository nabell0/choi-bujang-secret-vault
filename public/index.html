<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    [hidden] { display: none !important; }
    .auth { margin: 26px 0; padding: 18px 19px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 8px; font-size: 20px; }
    .auth form { display: grid; gap: 10px; margin-top: 12px; }
    .auth label { display: grid; gap: 4px; color: #bfd0e5; font-size: 15px; }
    .auth input, .auth textarea, li input, li textarea { font-family: inherit; }
    li form { display: grid; gap: 8px; }
    li input, li textarea { padding: 8px 10px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button { padding: 7px 14px; border: 1px solid #8ad8df; border-radius: 10px; background: transparent; color: #8ad8df; font-size: 14px; font-weight: 700; cursor: pointer; }
    .actions button.primary { background: #8ad8df; color: #101a28; }
    .actions button:disabled { opacity: .6; cursor: wait; }
    .auth textarea { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; resize: vertical; }
    .auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { justify-self: start; padding: 10px 18px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .status { margin: 0; }
    .auth .error { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: #612a3544; color: #ffe3e8; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
    integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
    crossorigin="anonymous"></script>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 한곳으로</div>
    <h1>점령된 자료실</h1>
    <p>로그인한 사람은 자기 가상 메모만 보고 추가·수정·삭제할 수 있습니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">이제 서버가 로그인 토큰을 확인한 요청에만 자료를 보냅니다. 로그인은 신원 확인일 뿐이며, 다른 사람 자료 접근은 다음 단계에서 막습니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <p id="auth-status" class="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label>이메일 <input id="login-email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="login-password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <form id="logout-form" hidden>
        <button id="logout-button" type="submit">로그아웃</button>
      </form>
      <p id="auth-error" class="error" role="alert" hidden></p>
    </section>
    <section id="note-editor" class="auth" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title">새 가상 메모</h2>
      <p class="status">가상 내용만 적고, 실제 개인정보는 넣지 마세요.</p>
      <form id="new-note-form">
        <label>제목 <input id="new-note-title" maxlength="200" required></label>
        <label>내용 <textarea id="new-note-body" maxlength="5000" rows="3"></textarea></label>
        <button id="new-note-button" type="submit">추가</button>
      </form>
      <p id="notes-error" class="error" role="alert" hidden></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    // No Supabase URL or key is written in this file; login settings come from /api/auth-config at runtime.
    const status = document.querySelector('#auth-status');
    const loginForm = document.querySelector('#login-form');
    const logoutForm = document.querySelector('#logout-form');
    const errorBox = document.querySelector('#auth-error');
    const email = document.querySelector('#login-email');
    const password = document.querySelector('#login-password');

    const showError = message => { errorBox.textContent = message; errorBox.hidden = !message; };
    const loginFailureReason = error => {
      switch (error.code) {
        case 'invalid_credentials': return '이메일 또는 비밀번호가 맞지 않습니다.';
        case 'email_not_confirmed': return '이메일 인증이 끝나지 않은 계정입니다. Supabase에서 계정 인증을 완료해 주세요.';
        case 'user_banned': return '사용이 정지된 계정입니다.';
        case 'over_request_rate_limit': return '로그인 시도가 너무 많습니다. 잠시 뒤 다시 시도해 주세요.';
      }
      if (error.name === 'AuthRetryableFetchError' || error.status === 0) {
        return '로그인 서버에 연결하지 못했습니다. 네트워크와 Project URL을 확인해 주세요.';
      }
      return `로그인에 실패했습니다: ${error.message}`;
    };

    const list = document.querySelector('#notes');
    const showListMessage = message => {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    };
    const editor = document.querySelector('#note-editor');
    const newNoteForm = document.querySelector('#new-note-form');
    const notesError = document.querySelector('#notes-error');
    const showNotesError = message => { notesError.textContent = message; notesError.hidden = !message; };
    const element = (tag, props = {}, children = []) => {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    };

    let currentToken = null;
    const apiErrorMessage = (status, data) => {
      if (status === 401 || status === 403) return '로그인을 확인할 수 없습니다. 다시 로그인해 주세요.';
      if (status === 404) return '메모를 찾을 수 없습니다. 이미 삭제되었을 수 있습니다.';
      if (status === 400 || status === 409) return data?.message ?? '입력값을 확인해 주세요.';
      return '요청을 처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.';
    };
    async function api(path, { method = 'GET', body } = {}) {
      const headers = { Authorization: `Bearer ${currentToken}` };
      if (body) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        method, cache: 'no-store', headers, body: body ? JSON.stringify(body) : undefined,
      });
      if (response.status === 204) return null;
      const data = await response.json().catch(() => null);
      if (!response.ok) throw new Error(apiErrorMessage(response.status, data));
      return data;
    }

    function noteView(note) {
      const item = element('li');
      const edit = element('button', { type: 'button', textContent: '수정' });
      const remove = element('button', { type: 'button', textContent: '삭제' });
      item.append(element('strong', { textContent: note.title }), element('span', { textContent: note.body }),
        element('div', { className: 'actions' }, [edit, remove]));
      edit.addEventListener('click', () => item.replaceWith(noteEditView(note)));
      remove.addEventListener('click', async () => {
        if (!window.confirm(`「${note.title}」 메모를 삭제할까요?`)) return;
        showNotesError('');
        remove.disabled = true;
        try {
          await api(`/api/notes/${note.id}`, { method: 'DELETE' });
          await loadNotes(currentToken);
        } catch (error) {
          remove.disabled = false;
          showNotesError(error.message);
        }
      });
      return item;
    }

    function noteEditView(note) {
      const title = element('input', { value: note.title, maxLength: 200, required: true, ariaLabel: '제목' });
      const body = element('textarea', { value: note.body, maxLength: 5000, rows: 3, ariaLabel: '내용' });
      const save = element('button', { type: 'submit', className: 'primary', textContent: '저장' });
      const cancel = element('button', { type: 'button', textContent: '취소' });
      const form = element('form', {}, [title, body, element('div', { className: 'actions' }, [save, cancel])]);
      const item = element('li', {}, [form]);
      cancel.addEventListener('click', () => item.replaceWith(noteView(note)));
      form.addEventListener('submit', async event => {
        event.preventDefault();
        showNotesError('');
        save.disabled = true;
        try {
          const updated = await api(`/api/notes/${note.id}`, { method: 'PUT', body: { title: title.value, body: body.value } });
          item.replaceWith(noteView(updated));
        } catch (error) {
          save.disabled = false;
          showNotesError(error.message);
        }
      });
      return item;
    }

    let notesRequest = 0;
    async function loadNotes(accessToken) {
      const current = ++notesRequest;
      currentToken = accessToken ?? null;
      editor.hidden = !currentToken;
      showNotesError('');
      if (!currentToken) {
        showListMessage('로그인하면 가상 메모가 보입니다.');
        return;
      }
      try {
        const notes = await api('/api/notes');
        if (current !== notesRequest) return;
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) showListMessage('아직 내 메모가 없습니다. 위에서 추가해 보세요.');
        else list.replaceChildren(...notes.map(noteView));
      } catch (error) {
        if (current === notesRequest) showListMessage(error.message);
      }
    }

    newNoteForm.addEventListener('submit', async event => {
      event.preventDefault();
      showNotesError('');
      const button = document.querySelector('#new-note-button');
      const title = document.querySelector('#new-note-title');
      const body = document.querySelector('#new-note-body');
      button.disabled = true;
      try {
        await api('/api/notes', { method: 'POST', body: { title: title.value, body: body.value } });
        newNoteForm.reset();
        await loadNotes(currentToken);
      } catch (error) {
        showNotesError(error.message);
      } finally {
        button.disabled = false;
      }
    });

    async function loadAuthConfig() {
      try {
        const response = await fetch('/api/auth-config', { cache: 'no-store' });
        const data = await response.json().catch(() => null);
        if (!response.ok || typeof data?.supabaseUrl !== 'string' || typeof data?.publishableKey !== 'string') return null;
        return data;
      } catch {
        return null;
      }
    }

    const authConfig = await loadAuthConfig();
    if (!authConfig || !window.supabase?.createClient) {
      status.textContent = '로그인 설정을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.';
      loadNotes(null);
    } else {
      const client = window.supabase.createClient(authConfig.supabaseUrl, authConfig.publishableKey);
      const render = session => {
        const user = session?.user;
        document.body.dataset.auth = user ? 'signed-in' : 'signed-out';
        status.textContent = user ? `로그인됨: ${user.email}` : '로그인하지 않았습니다.';
        loginForm.hidden = Boolean(user);
        logoutForm.hidden = !user;
      };
      client.auth.onAuthStateChange((_event, session) => {
        render(session);
        loadNotes(session?.access_token);
      });

      loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        showError('');
        const button = document.querySelector('#login-button');
        button.disabled = true;
        const { error } = await client.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
        password.value = '';
        button.disabled = false;
        if (error) showError(loginFailureReason(error));
      });

      logoutForm.addEventListener('submit', async event => {
        event.preventDefault();
        showError('');
        const { error } = await client.auth.signOut();
        if (error) showError(`로그아웃에 실패했습니다: ${error.message}`);
      });
    }
  </script>
</body>
</html>
