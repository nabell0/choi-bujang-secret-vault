<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    [hidden] { display: none !important; }
    .auth { margin: 26px 0; padding: 18px 19px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 8px; font-size: 20px; }
    .auth form { display: grid; gap: 10px; margin-top: 12px; }
    .auth label { display: grid; gap: 4px; color: #bfd0e5; font-size: 15px; }
    .auth input { padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { justify-self: start; padding: 10px 18px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .status { margin: 0; }
    .auth .error { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: #612a3544; color: #ffe3e8; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
    integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
    crossorigin="anonymous"></script>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 1단계 피해 확인</div>
    <h1>점령된 자료실</h1>
    <p>지금은 보호 장치가 없는 상태입니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">이제 서버가 로그인 토큰을 확인한 요청에만 자료를 보냅니다. 로그인은 신원 확인일 뿐이며, 다른 사람 자료 접근은 다음 단계에서 막습니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <p id="auth-status" class="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label>이메일 <input id="login-email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="login-password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <form id="logout-form" hidden>
        <button id="logout-button" type="submit">로그아웃</button>
      </form>
      <p id="auth-error" class="error" role="alert" hidden></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    // Only the public Project URL and publishable key belong here. Never put a secret key in browser files.
    const SUPABASE_URL = 'https://kcxnmaxipzlxdxwvpupv.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_h5difiorV3NhLy1USV8YmA_1cxVTjWk';

    const status = document.querySelector('#auth-status');
    const loginForm = document.querySelector('#login-form');
    const logoutForm = document.querySelector('#logout-form');
    const errorBox = document.querySelector('#auth-error');
    const email = document.querySelector('#login-email');
    const password = document.querySelector('#login-password');

    const showError = message => { errorBox.textContent = message; errorBox.hidden = !message; };
    const loginFailureReason = error => {
      switch (error.code) {
        case 'invalid_credentials': return '이메일 또는 비밀번호가 맞지 않습니다.';
        case 'email_not_confirmed': return '이메일 인증이 끝나지 않은 계정입니다. Supabase에서 계정 인증을 완료해 주세요.';
        case 'user_banned': return '사용이 정지된 계정입니다.';
        case 'over_request_rate_limit': return '로그인 시도가 너무 많습니다. 잠시 뒤 다시 시도해 주세요.';
      }
      if (error.name === 'AuthRetryableFetchError' || error.status === 0) {
        return '로그인 서버에 연결하지 못했습니다. 네트워크와 Project URL을 확인해 주세요.';
      }
      return `로그인에 실패했습니다: ${error.message}`;
    };

    const list = document.querySelector('#notes');
    const showListMessage = message => {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    };
    let notesRequest = 0;
    async function loadNotes(accessToken) {
      const current = ++notesRequest;
      if (!accessToken) {
        showListMessage('로그인하면 가상 메모가 보입니다.');
        return;
      }
      showListMessage('가상 자료를 불러오는 중입니다.');
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store', headers: { Authorization: `Bearer ${accessToken}` },
        });
        if (current !== notesRequest) return;
        if (response.status === 401 || response.status === 403) throw new Error('로그인을 확인할 수 없습니다. 다시 로그인해 주세요.');
        if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
      } catch (error) {
        if (current === notesRequest) showListMessage(error.message);
      }
    }

    if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY || !window.supabase?.createClient) {
      status.textContent = '로그인 설정이 아직 없습니다. Project URL과 publishable key를 확인해 주세요.';
      loadNotes(null);
    } else {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const render = session => {
        const user = session?.user;
        document.body.dataset.auth = user ? 'signed-in' : 'signed-out';
        status.textContent = user ? `로그인됨: ${user.email}` : '로그인하지 않았습니다.';
        loginForm.hidden = Boolean(user);
        logoutForm.hidden = !user;
      };
      client.auth.onAuthStateChange((_event, session) => {
        render(session);
        loadNotes(session?.access_token);
      });

      loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        showError('');
        const button = document.querySelector('#login-button');
        button.disabled = true;
        const { error } = await client.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
        password.value = '';
        button.disabled = false;
        if (error) showError(loginFailureReason(error));
      });

      logoutForm.addEventListener('submit', async event => {
        event.preventDefault();
        showError('');
        const { error } = await client.auth.signOut();
        if (error) showError(`로그아웃에 실패했습니다: ${error.message}`);
      });
    }
  </script>
</body>
</html>
